<div id="app">
  <header>
    <h1>Hollowwood Manor <small>Chapter I · The Sisters</small></h1>
    <div class="clock"><canvas id="watch" width="76" height="76" aria-hidden="true"></canvas><div><b id="time">8:30 PM</b><span id="timeSub">21 rounds to midnight</span></div></div>
    <div class="tools">
      <button id="btnRules" type="button">Rules</button>
      <button id="btnGuide" type="button">Helper: on</button>
      <button id="btnNotes" type="button">Notes</button>
      <button id="btnSound" type="button">Sound: on</button>
      <button id="btnPace" type="button">Pace: steady</button>
      <button id="btnNew" type="button">New night</button>
    </div>
  </header>
  <main>
    <section id="boardWrap">
      <div id="stage">
        <canvas id="board" tabindex="0" aria-label="The manor board. Two floors: the upper floor above, the ground floor below. Use the action buttons, or after rolling to move use the arrow keys and Enter."></canvas>
        <div id="banner"></div>
        <div id="caption"></div>
        <button id="skip" class="ghostbtn" type="button" hidden>Skip the opening</button>
        <div id="bigdie" hidden><div class="die big"></div><div class="bd-label" hidden></div></div>
        <div id="guide" hidden></div>
        <div id="draw" hidden></div>
        <div id="pop" hidden></div>
      </div>
      <div id="hint" role="status"></div>
    </section>
    <aside>
      <div class="heroes" id="heroes"></div>
      <div class="shared">
        <div class="box"><h3>Bond</h3><div class="bond" id="bond"></div><div class="sub" id="bondSub"></div></div>
        <div class="box"><h3>Wesley’s Insight</h3><div class="ins" id="ins"></div><div class="sub" id="keySub"></div></div>
      </div>
      <div class="box"><h3>On the table</h3><div class="tablebox" id="table"></div></div>
      <div class="box tray">
        <div class="dice">
          <div class="dslot"><div class="die" id="dieHero"></div><span id="dieHeroT">Move</span></div>
          <div class="dslot"><div class="die gh" id="dieGhost"></div><span id="dieGhostT">Lil'</span></div>
          <div class="dslot"><div class="die ho" id="dieHollow"></div><span id="dieHollowT">The Hollow</span></div>
        </div>
        <table class="haunt" id="haunt" aria-label="The haunt table"></table>
      </div>
      <div id="actions"></div>
      <div id="log" aria-live="polite"></div>
    </aside>
  </main>
</div>
<div id="start" class="veil"></div>
<div id="modal" class="veil" hidden></div>
<div id="notes" class="veil" hidden></div>
